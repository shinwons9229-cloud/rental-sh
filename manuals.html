<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>매뉴얼 목록 | 시헌테크 A/S 매뉴얼</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --color-primary: #0064ff;
      --color-primary-hover: #0056e0;
      --color-primary-soft: #e8f1ff;
      --color-bg: #f9fbff;
      --color-surface: #ffffff;
      --color-border: #d7e3f7;
      --color-border-strong: #b6c9eb;
      --color-text-main: #1b3d73;
      --color-text-sub: #4b5b82;
      --color-label: #8ea1c8;
      --color-inkjet: #00C896;
      --color-laser: #0064ff;
      --color-cleaner: #A259FF;
      --radius-lg: 16px;
      --radius-md: 12px;
      --max-width: 1140px;
      --shadow-soft: 0 10px 24px rgba(0, 40, 120, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      background-color: var(--color-bg);
      color: var(--color-text-main);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* 헤더 */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background-color: rgba(255, 255, 255, 0.8);
      backdrop-filter: saturate(180%) blur(20px);
      border-bottom: 1px solid var(--color-border);
    }

    .header-inner {
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 0 24px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 16px;
      cursor: pointer;
    }

    .logo-image {
      height: 32px;
      width: auto;
    }

    .logo-divider {
      width: 1px;
      height: 24px;
      background-color: var(--color-border);
    }

    .logo-text {
      font-size: 18px;
      font-weight: 600;
      color: var(--color-text-sub);
    }

    .nav-button {
      padding: 8px 20px;
      border-radius: 8px;
      border: none;
      background-color: var(--color-text-main);
      color: white;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .nav-button:hover {
      transform: scale(1.05);
    }

    /* 네비게이션 드롭다운 */
    .nav-item {
      position: relative;
      display: inline-block;
    }

    .nav-link {
      font-size: 18px;
      font-weight: 600;
      color: var(--color-text-sub);
      text-decoration: none;
      transition: color 0.2s;
      cursor: pointer;
      padding: 20px 0;
      display: block;
    }

    .nav-link:hover {
      color: var(--color-primary);
    }

    .dropdown-menu {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      background: white;
      border: 1px solid var(--color-border);
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 40, 120, 0.15);
      min-width: 240px;
      padding: 12px 0;
      margin-top: 0;
      z-index: 1000;
    }

    .nav-item:hover .dropdown-menu {
      display: block;
    }

    .dropdown-menu::before {
      content: '';
      position: absolute;
      top: -8px;
      left: -20px;
      right: -20px;
      height: 8px;
      background: transparent;
    }

    .dropdown-menu::after {
      content: '';
      position: absolute;
      top: 0;
      left: -20px;
      bottom: 0;
      width: 20px;
      background: transparent;
    }

    .dropdown-item {
      display: block;
      padding: 12px 24px;
      color: var(--color-text-main);
      text-decoration: none;
      font-size: 15px;
      font-weight: 500;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .dropdown-item:hover {
      background: var(--color-primary-soft);
      color: var(--color-primary);
    }

    /* 메인 */
    main {
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 0 24px;
      min-height: calc(100vh - 200px);
    }

    /* 브레드크럼 */
    .breadcrumb {
      padding: 32px 0 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 15px;
      color: var(--color-text-sub);
      flex-wrap: wrap;
    }

    .breadcrumb a {
      color: var(--color-primary);
      font-weight: 600;
    }

    .breadcrumb a:hover {
      text-decoration: underline;
    }

    .breadcrumb-separator {
      color: var(--color-label);
    }

    /* 섹션 */
    .section-header {
      padding: 24px 0 32px;
    }

    .section-title {
      font-size: 42px;
      font-weight: 700;
      letter-spacing: -1.5px;
      margin-bottom: 12px;
      color: var(--color-text-main);
    }

    .section-desc {
      font-size: 18px;
      color: var(--color-text-sub);
    }

    /* 검색 박스 */
    .search-box {
      margin-bottom: 40px;
    }

    .search-input {
      width: 100%;
      padding: 16px 20px;
      border-radius: 10px;
      border: 1px solid var(--color-border);
      background-color: var(--color-surface);
      font-size: 16px;
      outline: none;
      transition: all 0.2s;
    }

    .search-input::placeholder {
      color: var(--color-label);
    }

    .search-input:focus {
      border-color: var(--color-primary);
      box-shadow: 0 0 0 1px rgba(0, 100, 255, 0.28);
    }

    /* 매뉴얼 그리드 */
    .manual-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      margin-bottom: 80px;
    }

    .manual-card {
      background: var(--color-surface);
      border-radius: var(--radius-md);
      padding: 28px;
      border: 1px solid var(--color-border);
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      flex-direction: column;
    }

    .manual-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 30px rgba(0, 40, 120, 0.12);
      border-color: var(--color-border-strong);
    }

    .manual-header {
      margin-bottom: 16px;
    }

    .manual-title {
      font-size: 20px;
      font-weight: 700;
      line-height: 1.4;
      color: var(--color-primary);
      margin-bottom: 8px;
    }

    .manual-badges {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .manual-badge {
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
      background: var(--badge-bg);
      color: var(--badge-color);
    }

    .badge-inkjet {
      --badge-bg: #F0FDF9;
      --badge-color: #00C896;
    }

    .badge-laser {
      --badge-bg: #e8f1ff;
      --badge-color: #0064ff;
    }

    .badge-cleaner {
      --badge-bg: #F9F5FF;
      --badge-color: #A259FF;
    }

    .manual-content {
      font-size: 15px;
      color: var(--color-text-sub);
      line-height: 1.6;
      margin-bottom: 16px;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      flex: 1;
    }

    .manual-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      color: var(--color-label);
      padding-top: 16px;
      border-top: 1px solid var(--color-border);
    }

    /* 로딩 상태 */
    .loading-state, .empty-state {
      text-align: center;
      padding: 100px 20px;
      color: var(--color-label);
      font-size: 17px;
    }

    .hidden {
      display: none !important;
    }

    /* 페이지네이션 */
    .pagination {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin: 48px 0 80px;
    }

    .page-btn {
      min-width: 44px;
      height: 44px;
      padding: 0 16px;
      border: 1px solid var(--color-border);
      background: var(--color-surface);
      color: var(--color-text-main);
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .page-btn:hover:not(:disabled) {
      background: var(--color-primary-soft);
      border-color: var(--color-border-strong);
    }

    .page-btn.active {
      background: var(--color-primary);
      color: white;
      border-color: var(--color-primary);
    }

    .page-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    /* 푸터 */
    footer {
      border-top: 1px solid var(--color-border);
      background: var(--color-surface);
      margin-top: 120px;
    }

    .footer-inner {
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 40px 24px;
      text-align: center;
      font-size: 15px;
      color: var(--color-label);
    }

    footer a {
      color: var(--color-primary);
      font-weight: 600;
    }

    /* 반응형 */
    @media (max-width: 768px) {
      .header-inner {
        padding: 0 16px;
        height: auto;
        min-height: 64px;
        flex-wrap: wrap;
      }

      .header-inner > div {
        gap: 16px !important;
        flex-wrap: wrap;
      }

      .logo-container {
        gap: 12px;
      }

      .logo-image {
        height: 24px;
      }

      .logo-text {
        font-size: 15px;
      }

      .nav-link {
        font-size: 15px;
        padding: 12px 0;
      }

      .dropdown-menu {
        min-width: 200px;
        font-size: 14px;
      }

      .dropdown-item {
        padding: 10px 20px;
        font-size: 14px;
      }

      .section-title {
        font-size: 32px;
      }

      .manual-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <div style="display: flex; align-items: center; gap: 32px;">
        <div class="logo-container" onclick="location.href='index.html'">
          <img src="https://www.genspark.ai/api/files/s/nZUGwpE8" alt="시헌테크" class="logo-image">
          <div class="logo-divider"></div>
          <div class="logo-text">A/S 매뉴얼</div>
        </div>
        <a href="https://wellyfit.co.kr/company/" target="_blank" class="nav-link">회사소개</a>
        <div class="nav-item">
          <span class="nav-link">제품</span>
          <div class="dropdown-menu">
            <a href="https://wellyfit.co.kr/sh-3025a/" target="_blank" class="dropdown-item">공기청정기 SH-3025A/AN</a>
            <a href="https://wellyfit.co.kr/sh-3522a/" target="_blank" class="dropdown-item">공기청정기 SH-3522A/AN</a>
            <a href="https://wellyfit.co.kr/sterilizer/" target="_blank" class="dropdown-item">공기청정살균기</a>
            <a href="https://wellyfit.co.kr/circulator/" target="_blank" class="dropdown-item">공기순환기</a>
          </div>
        </div>
        <a href="quote-list.html" class="nav-link">견적문의</a>
      </div>
    </div>
  </header>

  <main>
    <!-- 브레드크럼 -->
    <nav class="breadcrumb">
      <a href="index.html">홈</a>
      <span class="breadcrumb-separator">›</span>
      <a href="#" id="categoryLink">카테고리</a>
      <span class="breadcrumb-separator">›</span>
      <a href="#" id="manufacturerLink">제조사</a>
      <span class="breadcrumb-separator">›</span>
      <span id="modelName">모델</span>
    </nav>

    <!-- 섹션 헤더 -->
    <div class="section-header">
      <h1 class="section-title" id="pageTitle">매뉴얼 목록</h1>
      <p class="section-desc" id="pageDesc">필요한 매뉴얼을 선택하세요</p>
    </div>

    <!-- 검색 -->
    <div class="search-box">
      <input
        type="search"
        id="searchInput"
        class="search-input"
        placeholder="매뉴얼 제목이나 증상을 검색하세요"
      />
    </div>

    <!-- 로딩 -->
    <div id="loadingState" class="loading-state">로딩 중...</div>
    <div id="emptyState" class="empty-state hidden">등록된 매뉴얼이 없습니다</div>

    <!-- 매뉴얼 그리드 -->
    <div id="manualGrid" class="manual-grid hidden"></div>

    <!-- 페이지네이션 -->
    <div id="pagination" class="pagination hidden"></div>
  </main>

  <footer>
    <div class="footer-inner" style="position: relative;">
      <div style="margin-bottom: 12px; font-weight: 600; color: var(--color-text-main);">주식회사 시헌테크</div>
      <div style="font-size: 14px; line-height: 1.8;">
        대표자 : 유재천 | 사업자등록번호 : 811-81-02009<br>
        사업장주소 : 경기도 파주시 검산로 301-50
      </div>
      <div style="margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--color-border);">
        Copyright © 시헌테크 All Rights Reserved.
      </div>
      <a href="admin.html" style="position: absolute; bottom: 0; right: 0; font-size: 12px; color: var(--color-label); text-decoration: none; opacity: 0.5; transition: opacity 0.2s;" onmouseover="this.style.opacity='1'" onmouseout="this.style.opacity='0.5'">관리자</a>
    </div>
  </footer>

  <!-- Supabase 라이브러리 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <!-- 설정 파일 -->
  <script src="js/config.js"></script>

  <script>
    // URL에서 파라미터 가져오기
    const urlParams = new URLSearchParams(window.location.search);
    const category = urlParams.get('category');
    const manufacturer = urlParams.get('manufacturer');
    const model = urlParams.get('model');

    // 파라미터 검증
    if (!category || !manufacturer || !model) {
      location.href = 'index.html';
    }

    // 카테고리별 색상 클래스
    const categoryBadgeClass = {
      '잉크젯 프린터': 'badge-inkjet',
      '레이저 프린터': 'badge-laser',
      '공기청정기': 'badge-cleaner'
    };

    // 페이지 초기화
    document.getElementById('modelName').textContent = model;
    document.getElementById('pageTitle').textContent = `${model} 매뉴얼`;
    document.getElementById('categoryLink').textContent = category;
    document.getElementById('categoryLink').href = `manufacturers.html?category=${encodeURIComponent(category)}`;
    document.getElementById('manufacturerLink').textContent = manufacturer;
    document.getElementById('manufacturerLink').href = `models.html?category=${encodeURIComponent(category)}&manufacturer=${encodeURIComponent(manufacturer)}`;

    // 페이지네이션 변수
    let currentPage = 1;
    const itemsPerPage = 10;
    let totalManuals = 0;
    let allManuals = [];
    let filteredManuals = [];

    // 매뉴얼 로드
    async function loadManuals() {
      try {
        const { data, error, count } = await supabase
          .from('manuals')
          .select('*', { count: 'exact' })
          .eq('category', category)
          .eq('manufacturer', manufacturer)
          .eq('model', model)
          .eq('is_published', true)
          .order('views', { ascending: false })
          .order('created_at', { ascending: false });

        if (error) throw error;

        allManuals = data || [];
        filteredManuals = allManuals;
        totalManuals = count || 0;

        if (totalManuals === 0) {
          document.getElementById('loadingState').classList.add('hidden');
          document.getElementById('emptyState').classList.remove('hidden');
          return;
        }

        renderManuals();
        renderPagination();

      } catch (error) {
        console.error('매뉴얼 로딩 오류:', error);
        document.getElementById('loadingState').innerHTML = '데이터를 불러오는데 실패했습니다.';
      }
    }

    // 매뉴얼 렌더링
    function renderManuals() {
      const grid = document.getElementById('manualGrid');
      const badgeClass = categoryBadgeClass[category];
      
      const start = (currentPage - 1) * itemsPerPage;
      const end = start + itemsPerPage;
      const pageManuals = filteredManuals.slice(start, end);

      grid.innerHTML = pageManuals.map(manual => `
        <div class="manual-card" onclick="goToDetail('${manual.id}')">
          <div class="manual-header">
            <div class="manual-title">${escapeHtml(manual.title)}</div>
            <div class="manual-badges">
              <span class="manual-badge ${badgeClass}">${category}</span>
              <span class="manual-badge ${badgeClass}">${manufacturer}</span>
              <span class="manual-badge ${badgeClass}">${model}</span>
            </div>
          </div>
          <div class="manual-content">${escapeHtml(manual.content || '내용 없음')}</div>
          <div class="manual-footer">
            <span>조회수 ${manual.views || 0}</span>
            <span>${formatDate(manual.created_at)}</span>
          </div>
        </div>
      `).join('');

      document.getElementById('loadingState').classList.add('hidden');
      document.getElementById('emptyState').classList.add('hidden');
      grid.classList.remove('hidden');
    }

    // 페이지네이션 렌더링
    function renderPagination() {
      const totalPages = Math.ceil(filteredManuals.length / itemsPerPage);
      
      if (totalPages <= 1) {
        document.getElementById('pagination').classList.add('hidden');
        return;
      }

      const pagination = document.getElementById('pagination');
      let html = '';

      // 이전 버튼
      html += `<button class="page-btn" onclick="changePage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>‹</button>`;

      // 페이지 번호
      for (let i = 1; i <= totalPages; i++) {
        if (i === 1 || i === totalPages || (i >= currentPage - 2 && i <= currentPage + 2)) {
          html += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="changePage(${i})">${i}</button>`;
        } else if (i === currentPage - 3 || i === currentPage + 3) {
          html += `<span class="page-btn" disabled>...</span>`;
        }
      }

      // 다음 버튼
      html += `<button class="page-btn" onclick="changePage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}>›</button>`;

      pagination.innerHTML = html;
      pagination.classList.remove('hidden');
    }

    // 페이지 변경
    function changePage(page) {
      const totalPages = Math.ceil(filteredManuals.length / itemsPerPage);
      if (page < 1 || page > totalPages) return;
      
      currentPage = page;
      renderManuals();
      renderPagination();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // 검색 기능
    document.getElementById('searchInput').addEventListener('input', (e) => {
      const query = e.target.value.toLowerCase().trim();
      
      if (!query) {
        filteredManuals = allManuals;
      } else {
        filteredManuals = allManuals.filter(manual => 
          manual.title.toLowerCase().includes(query) ||
          (manual.content && manual.content.toLowerCase().includes(query)) ||
          (manual.tags && manual.tags.toLowerCase().includes(query))
        );
      }

      currentPage = 1;
      
      if (filteredManuals.length === 0) {
        document.getElementById('manualGrid').classList.add('hidden');
        document.getElementById('pagination').classList.add('hidden');
        document.getElementById('emptyState').classList.remove('hidden');
      } else {
        renderManuals();
        renderPagination();
      }
    });

    // 상세 페이지로 이동
    function goToDetail(manualId) {
      location.href = `manual-detail.html?id=${manualId}`;
    }

    // HTML 이스케이프
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // 날짜 포맷
    function formatDate(dateString) {
      if (!dateString) return '';
      const date = new Date(dateString);
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      return `${year}.${month}.${day}`;
    }

    // 페이지 로드 시 실행
    loadManuals();
  </script>
</body>
</html>
